name: APB Android APK Builder






on:


  workflow_dispatch:
  
    inputs:
    
      job_id:
      
        description: APB job identifier
        
        required: true
        
        type: string
        
      repo_owner:
      
        description: Source repository owner
        
        required: true
        
        type: string
        
      repo_name:
      
        description: Source repository name
        
        required: true
        
        type: string
        
      branch:
      
        description: Source branch or tag
        
        required: true
        
        default: main
        
        type: string
        
      voice_id:
      
        description: ElevenLabs Voice ID
        
        required: true
        
        type: string
        
      mode:
      
        description: Build mode
        
        required: true
        
        default: automatic
        
        type: choice
        
        options: [automatic, advanced]
        




permissions:


  contents: read
  




env:


  APB_JOB_ID: ${{ inputs.job_id }}
  
  APB_VOICE_ID: ${{ inputs.voice_id }}
  




jobs:


  build:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 45
    
    steps:
    
      - name: Mint source repository installation token
      
        id: app-token
        
        uses: actions/create-github-app-token@v2
        
        with:
        
          app-id: ${{ secrets.APB_GITHUB_APP_ID }}
          
          private-key: ${{ secrets.APB_GITHUB_APP_PRIVATE_KEY }}
          
          owner: ${{ inputs.repo_owner }}
          
          repositories: ${{ inputs.repo_name }}
          




      - name: Check out the requested source repository
      
        uses: actions/checkout@v4
        
        with:
        
          repository: ${{ inputs.repo_owner }}/${{ inputs.repo_name }}
          
          ref: ${{ inputs.branch }}
          
          token: ${{ steps.app-token.outputs.token }}
          
          path: source
          
          fetch-depth: 1
          




      - name: Validate the ElevenLabs voice
      
        working-directory: source
        
        env:
        
          ELEVENLABS_API_KEY: ${{ secrets.APB_ELEVENLABS_API_KEY }}
          
        run: |
        
          set -euo pipefail
          
          test -n "${ELEVENLABS_API_KEY:-}" || { echo "ELEVENLABS_API_KEY is missing from builder repository secrets."; exit 21; }
          
          curl --fail --silent --show-error -H "xi-api-key: ${ELEVENLABS_API_KEY}" "https://api.elevenlabs.io/v1/voices/${APB_VOICE_ID}" >/tmp/apb-voice.json
          
          grep -q '"voice_id"' /tmp/apb-voice.json || { echo "ElevenLabs did not return a valid voice."; exit 22; }
          
          rm -f /tmp/apb-voice.json
          




      - name: Inspect supported Android project
      
        working-directory: source
        
        run: |
        
          set -euo pipefail
          
          if [ -f gradlew ] || find . -maxdepth 2 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | grep -q .; then
          
            echo "APB_FRAMEWORK=native-android" >> "$GITHUB_ENV"
            
          elif [ -f pubspec.yaml ] && grep -q '^flutter:' pubspec.yaml; then
          
            echo "APB_FRAMEWORK=flutter" >> "$GITHUB_ENV"
            
          elif [ -f package.json ] && grep -Eiq 'react-native|expo' package.json; then
          
            echo "APB_FRAMEWORK=react-native" >> "$GITHUB_ENV"
            
          else
          
            echo "Unsupported repository: no Native Android, Flutter, or React Native project was detected."; exit 23
            
          fi
          




      - name: Build the Android APK
      
        working-direc

























































